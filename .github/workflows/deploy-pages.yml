name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # 允许在 GitHub 仓库的 Actions 页面手动点击 "Run workflow" 触发
  workflow_dispatch:

# 授予 Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一次部署，后触发的排队而不是互相打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 本项目是纯静态站点，整个仓库根目录就是发布内容
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
